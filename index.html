<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>학교 감염병 대응 다중 역할 모의훈련</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .role-active { border-color: #4f46e5; background-color: #eef2ff; color: #4f46e5; }
        .stage-bg-0 { background-color: #3b82f6; } /* 관심/평시 */
        .stage-bg-1 { background-color: #eab308; color: black; } /* 주의/유입 */
        .stage-bg-2 { background-color: #f97316; } /* 경계/확산 */
        .stage-bg-3 { background-color: #ef4444; } /* 심각/대유행 */
        .stage-bg-4 { background-color: #10b981; } /* 복구/종결 */
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-32">

    <header id="headerBar" class="stage-bg-0 text-white px-4 py-4 shadow-md sticky top-0 z-50 transition-colors duration-500">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-base font-bold flex items-center gap-1">🏫 학교 감염병 비상대응 훈련</h1>
                <p id="stageText" class="text-xs opacity-90">현재 단계: 평시 대비 (관심)</p>
            </div>
            <div id="dayDisplay" class="bg-white/20 px-3 py-1 rounded-lg text-sm font-bold font-mono">0일차</div>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-4">

        <div class="bg-white p-4 rounded-2xl shadow-xs border border-slate-100">
            <h3 class="text-xs font-bold text-slate-400 uppercase mb-3 flex items-center gap-1">
                <i class="fa-solid fa-users"></i> 수행할 역할을 선택하세요 (실시간 전환 가능)
            </h3>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="changeRole('homeroom')" id="role-homeroom" class="role-btn p-3 border border-slate-200 rounded-xl text-center text-xs font-bold transition-all flex flex-col items-center gap-1">
                    <span class="text-lg">🧑‍🏫</span> 담임교사
                </button>
                <button onclick="changeRole('nurse')" id="role-nurse" class="role-btn p-3 border border-slate-200 rounded-xl text-center text-xs font-bold transition-all flex flex-col items-center gap-1">
                    <span class="text-lg">👩‍⚕️</span> 보건교사
                </button>
                <button onclick="changeRole('manager')" id="role-manager" class="role-btn p-3 border border-slate-200 rounded-xl text-center text-xs font-bold transition-all flex flex-col items-center gap-1">
                    <span class="text-lg">👨‍💼</span> 행정실장
                </button>
                <button onclick="changeRole('principal')" id="role-principal" class="role-btn p-3 border border-slate-200 rounded-xl text-center text-xs font-bold transition-all flex flex-col items-center gap-1">
                    <span class="text-lg">🦅</span> 교감/교장
                </button>
            </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
            <div class="bg-white p-3 rounded-xl border border-slate-100 text-center">
                <span class="text-[10px] text-slate-4
